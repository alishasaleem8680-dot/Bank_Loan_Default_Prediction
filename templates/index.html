<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Bank Loan Default Prediction</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f7fb;
            color: #1f2937;
        }

        .header {
            background: #17365d;
            color: white;
            padding: 35px 20px;
            text-align: center;
        }

        .header h1 {
            font-size: 32px;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 16px;
            opacity: 0.9;
        }

        .container {
            max-width: 1000px;
            margin: 35px auto;
            padding: 0 20px;
        }

        .card {
            background: white;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }

        .card h2 {
            margin-bottom: 8px;
            color: #17365d;
        }

        .description {
            color: #6b7280;
            margin-bottom: 25px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        label {
            font-weight: bold;
            margin-bottom: 7px;
        }

        input,
        select {
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 7px;
            font-size: 15px;
            background: white;
        }

        input:focus,
        select:focus {
            outline: none;
            border-color: #17365d;
        }

        .button-container {
            margin-top: 30px;
            text-align: center;
        }

        button {
            background: #17365d;
            color: white;
            border: none;
            padding: 14px 35px;
            border-radius: 7px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #0f2744;
        }

        .dashboard-button {
            display: inline-block;
            margin-left: 10px;
            background: #e8eef6;
            color: #17365d;
            text-decoration: none;
            padding: 13px 25px;
            border-radius: 7px;
            font-weight: bold;
        }

        .dashboard-button:hover {
            background: #d8e2ef;
        }

        .footer {
            text-align: center;
            color: #6b7280;
            margin: 25px 0;
            font-size: 14px;
        }

        @media (max-width: 700px) {
            .form-grid {
                grid-template-columns: 1fr;
            }

            .header h1 {
                font-size: 25px;
            }

            .dashboard-button {
                margin-left: 0;
                margin-top: 12px;
            }
        }
    </style>
</head>

<body>

    <!-- Header -->
    <div class="header">
        <h1>🏦 Bank Loan Default Prediction</h1>
        <p>Machine Learning Based Credit Risk Assessment</p>
    </div>


    <!-- Main Content -->
    <div class="container">

        <div class="card">

            <h2>Loan Applicant Information</h2>

            <p class="description">
                Enter the applicant's information to estimate the probability
                of loan default.
            </p>


            <!-- Prediction Form -->
            <form action="/predict" method="POST">

                <div class="form-grid">

                    <div class="form-group">
                        <label>Age</label>
                        <input
                            type="number"
                            name="Age"
                            min="18"
                            required
                        >
                    </div>


                    <div class="form-group">
                        <label>Income</label>
                        <input
                            type="number"
                            name="Income"
                            min="0"
                            required
                        >
                    </div>


                    <div class="form-group">
                        <label>Loan Amount</label>
                        <input
                            type="number"
                            name="LoanAmount"
                            min="0"
                            required
                        >
                    </div>


                    <div class="form-group">
                        <label>Credit Score</label>
                        <input
                            type="number"
                            name="CreditScore"
                            min="300"
                            max="850"
                            required
                        >
                    </div>


                    <div class="form-group">
                        <label>Months Employed</label>
                        <input
                            type="number"
                            name="MonthsEmployed"
                            min="0"
                            required
                        >
                    </div>


                    <div class="form-group">
                        <label>Number of Credit Lines</label>
                        <input
                            type="number"
                            name="NumCreditLines"
                            min="0"
                            required
                        >
                    </div>


                    <div class="form-group">
                        <label>Interest Rate (%)</label>
                        <input
                            type="number"
                            step="0.01"
                            name="InterestRate"
                            min="0"
                            required
                        >
                    </div>


                    <div class="form-group">
                        <label>Loan Term (Months)</label>
                        <input
                            type="number"
                            name="LoanTerm"
                            min="1"
                            required
                        >
                    </div>


                    <div class="form-group">
                        <label>DTI Ratio</label>
                        <input
                            type="number"
                            step="0.01"
                            name="DTIRatio"
                            min="0"
                            required
                        >
                    </div>


                    <div class="form-group">
                        <label>Education</label>

                        <select name="Education" required>

                            <option value="">
                                Select
                            </option>

                            <option value="High School">
                                High School
                            </option>

                            <option value="Bachelor's">
                                Bachelor's
                            </option>

                            <option value="Master's">
                                Master's
                            </option>

                            <option value="PhD">
                                PhD
                            </option>

                        </select>
                    </div>


                    <div class="form-group">
                        <label>Employment Type</label>

                        <select name="EmploymentType" required>

                            <option value="">
                                Select
                            </option>

                            <option value="Full-time">
                                Full-time
                            </option>

                            <option value="Part-time">
                                Part-time
                            </option>

                            <option value="Self-employed">
                                Self-employed
                            </option>

                            <option value="Unemployed">
                                Unemployed
                            </option>

                        </select>
                    </div>


                    <div class="form-group">
                        <label>Marital Status</label>

                        <select name="MaritalStatus" required>

                            <option value="">
                                Select
                            </option>

                            <option value="Single">
                                Single
                            </option>

                            <option value="Married">
                                Married
                            </option>

                            <option value="Divorced">
                                Divorced
                            </option>

                        </select>
                    </div>


                    <div class="form-group">
                        <label>Has Mortgage</label>

                        <select name="HasMortgage" required>

                            <option value="">
                                Select
                            </option>

                            <option value="Yes">
                                Yes
                            </option>

                            <option value="No">
                                No
                            </option>

                        </select>
                    </div>


                    <div class="form-group">
                        <label>Has Dependents</label>

                        <select name="HasDependents" required>

                            <option value="">
                                Select
                            </option>

                            <option value="Yes">
                                Yes
                            </option>

                            <option value="No">
                                No
                            </option>

                        </select>
                    </div>


                    <div class="form-group">
                        <label>Loan Purpose</label>

                        <select name="LoanPurpose" required>

                            <option value="">
                                Select
                            </option>

                            <option value="Business">
                                Business
                            </option>

                            <option value="Home">
                                Home
                            </option>

                            <option value="Education">
                                Education
                            </option>

                            <option value="Auto">
                                Auto
                            </option>

                            <option value="Other">
                                Other
                            </option>

                        </select>
                    </div>


                    <div class="form-group">
                        <label>Has Co-Signer</label>

                        <select name="HasCoSigner" required>

                            <option value="">
                                Select
                            </option>

                            <option value="Yes">
                                Yes
                            </option>

                            <option value="No">
                                No
                            </option>

                        </select>
                    </div>

                </div>


                <!-- Buttons -->
                <div class="button-container">

                    <button type="submit">
                        Predict Default
                    </button>

                    <a href="/dashboard" class="dashboard-button">
                        📊 View Model Dashboard
                    </a>

                </div>

            </form>

        </div>

    </div>


    <!-- Footer -->
    <div class="footer">
        Bank Loan Default Prediction | Machine Learning Project
    </div>

</body>
</html>
