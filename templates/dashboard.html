<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Model Performance Dashboard</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f7fb;
            color: #1f2937;
        }

        .header {
            background: #17365d;
            color: white;
            padding: 35px 20px;
            text-align: center;
        }

        .header h1 {
            font-size: 30px;
            margin-bottom: 8px;
        }

        .header p {
            font-size: 16px;
            opacity: 0.9;
        }

        .container {
            max-width: 1100px;
            margin: 35px auto;
            padding: 0 20px;
        }

        .section-title {
            color: #17365d;
            margin-bottom: 20px;
        }

        .metrics {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 15px;
            margin-bottom: 35px;
        }

        .metric-card {
            background: white;
            padding: 22px 15px;
            text-align: center;
            border-radius: 10px;
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.07);
        }

        .metric-card h3 {
            color: #6b7280;
            font-size: 14px;
            margin-bottom: 10px;
        }

        .metric-value {
            color: #17365d;
            font-size: 25px;
            font-weight: bold;
        }

        .report-card {
            background: white;
            padding: 25px;
            margin-bottom: 25px;
            border-radius: 12px;
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.07);
        }

        .report-card h3 {
            color: #17365d;
            margin-bottom: 20px;
            text-align: center;
        }

        .report-card img {
            display: block;
            width: 100%;
            max-width: 850px;
            height: auto;
            margin: 0 auto;
            border-radius: 8px;
        }

        .button-container {
            text-align: center;
            margin: 35px 0;
        }

        .button {
            display: inline-block;
            background: #17365d;
            color: white;
            text-decoration: none;
            padding: 13px 30px;
            border-radius: 7px;
            font-weight: bold;
            margin: 5px;
        }

        .button:hover {
            background: #0f2744;
        }

        .footer {
            text-align: center;
            color: #6b7280;
            margin: 30px 0;
            font-size: 14px;
        }

        @media (max-width: 900px) {
            .metrics {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        @media (max-width: 600px) {
            .metrics {
                grid-template-columns: repeat(2, 1fr);
            }

            .header h1 {
                font-size: 25px;
            }
        }
    </style>
</head>

<body>

    <div class="header">
        <h1>📊 Model Performance Dashboard</h1>
        <p>Bank Loan Default Prediction</p>
    </div>


    <div class="container">

        <h2 class="section-title">
            Model Performance
        </h2>


        <div class="metrics">

            <div class="metric-card">
                <h3>Accuracy</h3>
                <div class="metric-value">79.64%</div>
            </div>

            <div class="metric-card">
                <h3>Precision</h3>
                <div class="metric-value">28.79%</div>
            </div>

            <div class="metric-card">
                <h3>Recall</h3>
                <div class="metric-value">51.15%</div>
            </div>

            <div class="metric-card">
                <h3>F1 Score</h3>
                <div class="metric-value">36.85%</div>
            </div>

            <div class="metric-card">
                <h3>ROC-AUC</h3>
                <div class="metric-value">75.32%</div>
            </div>

        </div>


        <div class="report-card">

            <h3>Model Comparison</h3>

            <img
                src="/static/reports/model_comparison.png"
                alt="Model Comparison"
            >

        </div>


        <div class="report-card">

            <h3>Feature Importance</h3>

            <img
                src="/static/reports/feature_importance.png"
                alt="Feature Importance"
            >

        </div>


        <div class="report-card">

            <h3>Confusion Matrix</h3>

            <img
                src="/static/reports/confusion_matrix.png"
                alt="Confusion Matrix"
            >

        </div>


        <div class="button-container">

            <a href="/" class="button">
                Make a Prediction
            </a>

        </div>

    </div>


    <div class="footer">
        Bank Loan Default Prediction | Machine Learning Project
    </div>

</body>
</html>
